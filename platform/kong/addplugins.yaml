add-plugins:
  - selectors:
      - $..services[*]
    overwrite: yes
    plugins:
      - name: response-transformer
        config:
          add:
            headers:
              - "X-SNCF-Security:passed"
      - name: key-auth
        config:
          key_names:
          - apikey
      - name: rate-limiting-advanced
        config:
          error_code: 429
          error_message: API rate limit exceeded
          limit:
          - 10
          - 1000
          - 10000
          window_size:
          - 60
          - 3600
          - 86400
          strategy: local
          window_type: fixed
        enabled: true
