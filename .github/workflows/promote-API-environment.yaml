name: Promote API to Konnect Environments

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      entite:
        description: "Entite"
        required: true
        type: choice
        default: SNCF
        options:
          - SNCF
          - SD_A
      stage:
        description: "Stage"
        required: true
        type: choice
        default: TEST
        options:
          - DEV
          - TEST
          - PROD
jobs:
  promote-api:
    #runs-on: ubuntu-latest
    runs-on: self-hosted
    environment:
      name:  ${{ inputs.entite }}_${{ inputs.stage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Change the API status to "test"
      # Change the Gateway URL to Test URL
      - name: Prepare TEST process
        if: ${{ inputs.stage == 'TEST' }}
        run: |
          cp -r _DEV/* _TEST/
          yq -i '(.apis[].attributes.status) = ["test"]' _TEST/catalog_devportal/catalog_devportal.yaml
          yq -i '.servers[0].url = "${{ vars.KONG_GATEWAY_ADDR }}"' _TEST/catalog_devportal/openapi.yaml
      
      # Change the API status to "production"
      # Change the DevPortal Name to Production DevPortal
      # Change the Gateway URL to Production URL
      - name: Prepare PROD process
        if: ${{ inputs.stage == 'PROD' }}
        run: |
          cp -r _TEST/* _PROD/
          yq -i '(.apis[].attributes.status) = ["production"]' _PROD/catalog_devportal/catalog_devportal.yaml
          yq -i '(.portals[]._external.selector.matchFields.name) = "SNCF - Prod"' _PROD/catalog_devportal/catalog_devportal.yaml
          yq -i '.servers[0].url = "${{ vars.KONG_GATEWAY_ADDR }}"' _PROD/catalog_devportal/openapi.yaml
      
      - name: Setup deck for Kong Gateway
        if: runner.environment != 'self-hosted'
        uses: kong/setup-deck@v1
        with:
          deck-version: '1.59.1'
          wrapper: false

      - name: Kong Gateway sync
        run: |
          deck gateway sync --select-tag platform-repo-managed \
              _${{ inputs.stage}}/kong/kong.yaml \
              --konnect-control-plane-name ${{ vars.KONNECT_CONTROL_PLANE_NAME }} \
              --konnect-token ${{ secrets.KONNECT_PAT }} \
              --konnect-addr ${{ vars.KONNECT_ADDR }}

      - name: Setup kongctl for Konnect Catalog and DevPortal
        if: runner.environment != 'self-hosted'
        uses: kong/setup-kongctl@v1
        with:
          kongctl-version: 0.9.0

      - name: Catalog and DevPortal sync
        run: |
          kongctl apply --auto-approve \
                  -f _${{ inputs.stage}}/catalog_devportal/catalog_devportal.yaml \
                  --pat ${{ secrets.KONNECT_PAT }} \
                  --base-url ${{ vars.KONNECT_ADDR }}
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "ci: deploy konnect config" || exit 0

      - name: Push
        run: |
          git push origin HEAD