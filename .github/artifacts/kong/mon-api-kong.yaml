_format_version: "3.0"
services:
- host: httpbin.konghq.com
  id: 64968ae0-88be-5ac8-a787-cad7fd5cbca8
  name: mon-api
  path: /
  plugins:
  - config:
      access:
      - "local ns='/monapi/v1' -- this strips the '/monapi/v1' namespace from the
        path\nlocal nst=ns:sub(-1,-1)=='/' and ns or (ns..'/')\nlocal function sn(u)\n\tlocal
        s,e=u:find(nst,1,true)\n\tif s then\n\t\treturn u:sub(1,s)..u:sub(e+1,-1)\n\tend\n\tif
        u:sub(-#ns,-1)==ns then\n\t\tu=u:sub(1,-#ns-1)\n\t\tif u=='' then u='/' end\n\tend\n\treturn
        u\nend\nngx.var.upstream_uri=sn(ngx.var.upstream_uri)"
    name: pre-function
  port: 443
  protocol: https
  routes:
  - id: 8792dafa-87c1-56ee-a406-56ba0f01b56c
    methods:
    - GET
    name: mon-api_anything-get
    paths:
    - ~/monapi/v1/anything$
    plugins: []
    regex_priority: 200
    strip_path: false
    tags:
    - mon-api
  - id: 3f5b2ae9-a0ec-5a74-a568-e080616f8a17
    methods:
    - POST
    name: mon-api_anything-post
    paths:
    - ~/monapi/v1/anything$
    plugins: []
    regex_priority: 200
    strip_path: false
    tags:
    - mon-api
  - id: 697bdef6-e573-521a-82b6-288af232ef8f
    methods:
    - GET
    name: mon-api_query
    paths:
    - ~/monapi/v1/anything/query$
    plugins: []
    regex_priority: 200
    strip_path: false
    tags:
    - mon-api
  - id: 5fe0ee87-4e96-5f0a-9858-61ee22a68635
    methods:
    - GET
    name: mon-api_delay
    paths:
    - ~/monapi/v1/delay/(?<delay_value>[^#?/]+)$
    plugins: []
    regex_priority: 100
    strip_path: false
    tags:
    - mon-api
  - id: 7cc1dde6-7327-52d1-b84c-30c624863ac5
    methods:
    - GET
    name: mon-api_status-code
    paths:
    - ~/monapi/v1/status/(?<codes>[^#?/]+)$
    plugins: []
    regex_priority: 100
    strip_path: false
    tags:
    - mon-api
  - id: 7efd67cd-e3fe-5260-999f-338c0351025c
    methods:
    - GET
    name: mon-api_get-uuid
    paths:
    - ~/monapi/v1/uuid$
    plugins: []
    regex_priority: 200
    strip_path: false
    tags:
    - mon-api
  tags:
  - mon-api
upstreams: []
