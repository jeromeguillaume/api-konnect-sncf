_format_version: "3.0"
consumer_groups:
- name: gold
  tags:
  - platform-repo-managed
- name: silver
  tags:
  - platform-repo-managed
- name: bronze
  tags:
  - platform-repo-managed
consumers:
- groups:
  - name: gold
  keyauth_credentials:
  - key: gold
    tags:
    - platform-repo-managed
  tags:
  - platform-repo-managed
  username: gold-1
- groups:
  - name: silver
  keyauth_credentials:
  - key: silver
    tags:
    - platform-repo-managed
  tags:
  - platform-repo-managed
  username: silver-1
- groups:
  - name: bronze
  keyauth_credentials:
  - key: bronze
    tags:
    - platform-repo-managed
  tags:
  - platform-repo-managed
  username: bronze-1
services:
- host: httpbin.konghq.com
  id: 64968ae0-88be-5ac8-a787-cad7fd5cbca8
  name: mon-api
  path: /
  plugins:
  - config:
      add:
        headers:
        - X-SNCF-Security:passed
    name: response-transformer
    tags:
    - platform-repo-managed
  - config:
      key_names:
      - apikey
    name: key-auth
    tags:
    - platform-repo-managed
  - config:
      error_code: 429
      error_message: API rate limit exceeded
      limit:
      - 10
      - 1000
      - 10000
      strategy: local
      window_size:
      - 60
      - 3600
      - 86400
      window_type: fixed
    enabled: true
    name: rate-limiting-advanced
    tags:
    - platform-repo-managed
  port: 443
  protocol: https
  routes:
  - id: 8792dafa-87c1-56ee-a406-56ba0f01b56c
    methods:
    - GET
    name: mon-api_anything-get
    paths:
    - ~/anything$
    plugins: []
    protocols:
    - https
    - http
    regex_priority: 200
    strip_path: false
    tags:
    - mon-api
    - platform-repo-managed
  - id: 3f5b2ae9-a0ec-5a74-a568-e080616f8a17
    methods:
    - POST
    name: mon-api_anything-post
    paths:
    - ~/anything$
    plugins: []
    protocols:
    - https
    - http
    regex_priority: 200
    strip_path: false
    tags:
    - mon-api
    - platform-repo-managed
  - id: 697bdef6-e573-521a-82b6-288af232ef8f
    methods:
    - GET
    name: mon-api_query
    paths:
    - ~/anything/query$
    plugins: []
    protocols:
    - https
    - http
    regex_priority: 200
    strip_path: false
    tags:
    - mon-api
    - platform-repo-managed
  - id: 5fe0ee87-4e96-5f0a-9858-61ee22a68635
    methods:
    - GET
    name: mon-api_delay
    paths:
    - ~/delay/(?<delay_value>[^#?/]+)$
    plugins: []
    protocols:
    - https
    - http
    regex_priority: 100
    strip_path: false
    tags:
    - mon-api
    - platform-repo-managed
  - id: 7cc1dde6-7327-52d1-b84c-30c624863ac5
    methods:
    - GET
    name: mon-api_status-code
    paths:
    - ~/status/(?<codes>[^#?/]+)$
    plugins: []
    protocols:
    - https
    - http
    regex_priority: 100
    strip_path: false
    tags:
    - mon-api
    - platform-repo-managed
  - id: 7efd67cd-e3fe-5260-999f-338c0351025c
    methods:
    - GET
    name: mon-api_get-uuid
    paths:
    - ~/uuid$
    plugins: []
    protocols:
    - https
    - http
    regex_priority: 200
    strip_path: false
    tags:
    - mon-api
    - platform-repo-managed
  tags:
  - mon-api
  - platform-repo-managed
upstreams: []
